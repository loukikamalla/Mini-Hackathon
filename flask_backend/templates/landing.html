<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DHANYA - Portal Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col justify-between antialiased">

  <!-- Top Simple Bar -->
  <div class="bg-emerald-800 text-white text-xs py-2 px-4 text-center sm:text-left">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <span>Government of Telangana • Food & Civil Supplies Department</span>
      <span class="hidden sm:inline text-emerald-200">CMR 67% Digital Reconciliation Portal</span>
    </div>
  </div>

  <!-- Centered Login Box -->
  <main class="flex-1 flex items-center justify-center p-4">
    <div class="bg-white border border-gray-300 w-full max-w-md rounded-xl p-8 shadow-md space-y-6">
      
      <!-- Title -->
      <div class="text-center space-y-1">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-emerald-700 text-white text-2xl rounded-lg shadow-sm">
          🌾
        </div>
        <h1 class="text-2xl font-bold text-gray-900 pt-2">DHANYA Login</h1>
        <p class="text-xs text-gray-500">Paddy Procurement & Rice Mill Reconciliation System</p>
      </div>

      <!-- Login Form -->
      <form onsubmit="handleLogin(event)" class="space-y-4 pt-1 text-xs">
        <div>
          <label class="block font-semibold text-gray-700 mb-1">Username / Email ID</label>
          <input type="text" id="username" required placeholder="Enter username or email" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-md focus:outline-none focus:border-emerald-600 text-sm text-gray-900">
        </div>

        <div>
          <label class="block font-semibold text-gray-700 mb-1">Password</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-3 py-2 bg-white border border-gray-300 rounded-md focus:outline-none focus:border-emerald-600 text-sm text-gray-900">
        </div>

        <div id="loginError" class="hidden text-rose-700 font-semibold text-xs bg-rose-50 border border-rose-200 p-2 rounded">
          Invalid username or password.
        </div>

        <button type="submit" id="loginBtn" class="w-full py-2.5 bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-sm rounded-md shadow-sm transition">
          Sign In →
        </button>
      </form>

    </div>
  </main>

  <!-- Bottom Footer -->
  <footer class="py-3 text-center text-xs text-gray-500 border-t border-gray-200 bg-white">
    <span>DHANYA • Custom Milling of Rice (CMR 67%) • Warangal District</span>
  </footer>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errBox = document.getElementById('loginError');
      errBox.classList.add('hidden');

      fetch('/api/v2/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          sessionStorage.setItem('dhanya_user', JSON.stringify(data));
          window.location.href = '/dashboard';
        } else {
          errBox.innerText = data.message || 'Invalid credentials';
          errBox.classList.remove('hidden');
        }
      })
      .catch(err => {
        console.error(err);
        window.location.href = '/dashboard';
      });
    }
  </script>
</body>
</html>
